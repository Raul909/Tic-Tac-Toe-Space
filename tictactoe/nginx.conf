# nginx.conf — load balancer for multiple Node.js instances
# Usage: nginx -c /path/to/nginx.conf
#
# Start app instances on ports 3001-3004, then run nginx on port 3000.
# All instances share Redis (sessions) and MongoDB (data).

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Upstream pool — add/remove instances here
    upstream tictactoe {
        # Sticky sessions via IP hash so Socket.IO reconnects hit the same node.
        # Replace with least_conn if you use the Redis socket.io adapter (recommended).
        ip_hash;

        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
        server 127.0.0.1:3004;

        keepalive 64;
    }

    # Rate limiting zone (shared across workers)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;

    server {
        listen 3000;
        server_name _;

        # Gzip
        gzip on;
        gzip_types text/plain application/javascript application/json text/css;
        gzip_min_length 1024;

        # Static files served directly (bypass Node)
        location /public/ {
            root /app;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Auth endpoints — strict rate limit
        location ~ ^/api/(login|register|logout) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://tictactoe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://tictactoe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO — requires upgrade + long-lived connections
        location /socket.io/ {
            proxy_pass http://tictactoe;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Everything else
        location / {
            proxy_pass http://tictactoe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
